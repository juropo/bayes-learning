[project]
name = "bayes-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.2",
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyagrum>=2.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
